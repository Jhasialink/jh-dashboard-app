<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JH 업무 대시보드">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 폰 앱: 맥 대시보드와 같은 'Mercury' 결(밝은 라벤더 바탕·메르큐리 인디고·색 한 단계로 띄움·알약 버튼). 엄지로 쓰기 좋게 큼직하게 */
:root{--bg:#fbfcfd;--card:#fff;--ink:#28253b;--ink2:#554e7b;--mute:#70707d;--line:#ececf3;--line2:#f2f2f8;--soft:#f7f7fd;--gold:#5266eb;--gold2:#9cb4e8;--goldbg:#edecfb;--navy:#3d4fd0;--me:#5266eb;--red:#c94a5c;--redbg:#fbeaed;--green:#2f9d6a;--greenbg:#e5f5ee;--blue:#5266eb;--sh:0 1px 2px rgba(40,37,59,.03);--hh:96px}
@media (prefers-color-scheme:dark){:root{--bg:#171721;--card:#1e1e2a;--ink:#ededf3;--ink2:#c3c3cc;--mute:#8f8fa0;--line:#2a2a3a;--line2:#252534;--soft:#232331;--gold:#8b9bff;--gold2:#9cb4e8;--goldbg:rgba(139,155,255,.14);--navy:#9cb4e8;--me:#5266eb;--redbg:rgba(201,74,92,.18);--green:#5cc28a;--greenbg:rgba(92,194,138,.13);--blue:#9cb4e8;--sh:0 1px 2px rgba(0,0,0,.25)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{overflow-x:hidden;width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:inherit} b{font-weight:600} ul{padding-left:18px;margin:0} li{margin:3px 0}
.muted{color:var(--mute);font-size:13px}
/* 머리 */
header{position:sticky;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.htop{display:flex;align-items:center;gap:8px} h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em}
#conn{margin-left:auto;font-size:12px;color:var(--mute);display:flex;align-items:center;gap:5px;white-space:nowrap} #conn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mute)}
#conn.ok::before{background:var(--green);box-shadow:0 0 0 3px var(--greenbg)} #conn.warn::before{background:var(--gold)} #conn.bad::before{background:var(--red)}
#head{display:block;margin-top:4px;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow-x:auto;scrollbar-width:none} #head::-webkit-scrollbar{display:none} #head b{color:var(--ink)}
.stale{margin:0 16px 8px;background:var(--goldbg);color:var(--gold);border-radius:10px;padding:7px 12px;font-size:12.5px}
/* 카드 */
main{padding:4px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px 16px;margin:0 0 12px;min-width:0;overflow:hidden}
.card h2{margin:0 0 10px;font-size:15.5px;font-weight:650;display:flex;gap:8px;align-items:center;letter-spacing:-.015em;cursor:pointer;user-select:none}
.card h2::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s;opacity:.6}
.card.fold h2{margin:0} .card.fold h2::after{transform:rotate(-45deg)} .card.fold>*:not(h2){display:none!important}
.badge{background:var(--goldbg);color:var(--gold);border-radius:999px;padding:0 8px;font-size:12px;font-weight:600;line-height:20px}.badge.zero{background:var(--line2);color:var(--mute)}
h3{font-size:12px;font-weight:600;color:var(--mute);margin:14px 0 6px}
.cc{display:none}
/* 비서 케어 띠 */
#care:empty{display:none}.care{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:14px;padding:10px 14px;margin:0 0 12px;box-shadow:var(--sh)}
.chd{display:flex;gap:8px;align-items:baseline;margin-bottom:2px}.chd b{font-size:13.5px;color:var(--gold)}.care ul{list-style:none;margin:0;padding:0}
.cv{display:flex;gap:8px;align-items:center;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line2);margin:0}.cv:last-child{border:0}
.cl{flex:0 0 auto;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--line2);color:var(--mute)}.cv.now .cl{background:var(--gold);color:#fff}.cv.miss .cl{background:var(--redbg);color:var(--red)}.cv.soon .cl{background:var(--goldbg);color:var(--gold)}.cv.tip .cl{background:var(--greenbg);color:var(--green)}
.ct{flex:1;min-width:0}.snap .care .ca{display:none}#care.snap button.pok{display:inline-block!important;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:8px;padding:3px 8px;font:inherit;font-size:12px}
/* 홈 구성(맥과 같음): 비서 한 줄 · 시간표 · 업무 흐름 · 이번 주 */
#hai:empty,#htl:empty,#hflow:empty,#hweek:empty{display:none}
.hai{display:flex;gap:10px;align-items:flex-start;background:var(--goldbg);border-radius:16px;padding:12px 14px;margin:0 0 12px}.hav{flex:0 0 28px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-size:13px}
.hai p{margin:0;font-size:15px;font-weight:500;line-height:1.45}.hai p small{display:block;font-size:12px;color:var(--ink2);font-weight:400;margin-top:2px}.hstale{display:inline-block;margin-top:4px;font-size:11.5px;color:var(--red);background:var(--redbg);border-radius:6px;padding:1px 7px}
.htl,.hfa,.hweek{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}.htl{padding:12px 14px 8px;margin:0 0 12px}.hh{display:flex;gap:8px;align-items:baseline}.hh b{font-size:14.5px;font-weight:550}.hh>.muted:last-child{display:none}
.tbar{position:relative;height:40px;border-radius:10px;background:var(--soft);margin:22px 0 18px}.hr{position:absolute;top:0;bottom:-16px;border-left:1px dashed var(--line);font-size:10px;color:var(--mute)}.hr span{position:absolute;bottom:0;left:3px;white-space:nowrap}
.blk{position:absolute;top:5px;height:30px;border-radius:8px;padding:5px 8px;font-size:11.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.blk.ev{background:var(--gold);color:#fff}.blk.cls{background:var(--greenbg);color:var(--green)}
.nowm{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--red)}.nowm span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--red);font-weight:600;white-space:nowrap}.tlempty{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--mute)}
.hflow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 12px}.hfa{padding:12px}.hfh{display:flex;align-items:center;gap:7px;margin-bottom:8px}.hfh b{font-size:13.5px;font-weight:550}.snap .hfh a{display:none}.hfi{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px}
.hfa:first-child,.hfa:last-child{grid-column:1/-1}#hflow.snap button.hch{display:block!important;flex:1;border:0;border-radius:10px;padding:8px 2px;background:var(--soft);font:inherit;font-size:11.5px;color:var(--ink2)}#hflow .hch b{display:block;font-size:16px;font-weight:500}#hflow .hch.on{background:var(--greenbg);color:var(--green)}
.hchs{display:flex;gap:6px}.hln{font-size:12px;color:var(--ink2);margin-top:8px}.hkv{display:flex;flex-direction:column;gap:4px}.hkv div{display:flex;justify-content:space-between;align-items:baseline;background:var(--soft);border-radius:8px;padding:5px 9px}.hkv b{font-size:15px;font-weight:500}.hkv b.r{color:var(--red)}.hkv span{font-size:11.5px;color:var(--mute);order:-1}
.hses{display:flex;flex-direction:column;gap:4px}.hse{display:flex;align-items:center;gap:6px;font-size:12.5px;pointer-events:none}.hse small{margin-left:auto;color:var(--mute);font-size:11px}.rdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:#c3c3cc}.rdot.busy{background:var(--green)}.rdot.open{background:var(--gold)}
.hweek{padding:12px 14px;margin:0 0 12px}.hweek h2{margin:0 0 6px;font-size:14.5px;font-weight:550}.hk{display:none}.wrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.wrow::-webkit-scrollbar{display:none}
.wday{flex:0 0 132px;background:var(--soft);border-radius:12px;padding:9px;min-height:84px;font-size:12px}.wday b{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}.wday.today{background:var(--goldbg);box-shadow:inset 0 0 0 1.5px var(--gold)}
.we{background:var(--card);border-radius:6px;padding:3px 6px;margin:3px 0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.we.ev{color:var(--gold)}.we.dl{color:var(--red)}.we.cl{color:var(--green)}
@media (min-width:700px){#t-today.on{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}#hai,#htl,#hweek,#care{grid-column:1/-1}
 .hflow{grid-template-columns:1fr;margin:0}.hfa:first-child,.hfa:last-child{grid-column:auto}.hkv{flex-direction:row}.hkv div{flex:1;flex-direction:column;align-items:flex-start}.hkv span{order:1}.wday{flex:1 0 110px}
 #t-more.on{display:block;column-count:2;column-gap:14px}#t-more .card{break-inside:avoid;margin:0 0 14px;display:inline-block;width:100%}.msec{display:none}}
@media (min-width:1100px){#t-more.on{column-count:3}.hflow{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* 오늘 할 것 한 목록(폰) */
#hlist:empty{display:none}.hlist{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px 14px 12px;margin:0 0 12px}.hlist h2{margin:0 0 4px;font-size:15.5px;font-weight:550;display:flex;gap:8px;align-items:center}
.hgrp{font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 2px}.hgrp span{opacity:.8}.hgrp.r{color:var(--red)}.hgrp.a{color:#b7791f}.hgrp.hempty{display:none}body.sorting .hgrp.hempty{display:block;padding:10px;border:1.5px dashed var(--line);border-radius:10px}
.hit{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line2)}.hit:last-of-type{border-bottom:0}.hit.hdone .ht{color:var(--mute);text-decoration:line-through}
.hcb{flex:0 0 22px;display:grid;place-items:center}#hlist.snap input[type=checkbox]{display:grid!important;appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:7px;margin:0;place-content:center}
#hlist.snap input[type=checkbox]:checked{background:var(--gold);border-color:var(--gold)}#hlist.snap input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
#hlist.snap button.hck{display:block!important;width:22px;height:22px;border:2px solid var(--line);border-radius:7px;background:none;color:var(--mute);font-size:11px;padding:0}.hck0{width:6px;height:6px;border-radius:50%;background:var(--line)}
.ht{flex:1;min-width:0;font-size:14.5px;line-height:1.4}.ht small{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.hit .tag{flex:0 0 auto;font-size:10.5px;font-weight:600;border-radius:6px;padding:1px 6px;background:var(--line2);color:var(--mute)}.t-c{background:#f3e8ff!important;color:#7c3aed!important}.t-s{background:#e0f2fe!important;color:#0369a1!important}.t-l{background:var(--greenbg)!important;color:var(--green)!important}.t-a{background:var(--goldbg)!important;color:var(--gold)!important}
.hdue{flex:0 0 auto;font-size:11.5px;color:var(--mute);font-weight:600}.hdue.r{color:var(--red)}.hdue.a{color:#b7791f}
#hlist.snap button.hask{display:inline-block!important;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:40px;padding:3px 9px;font:inherit;font-size:11.5px;flex:0 0 auto}
#hlist.snap form{display:flex!important;margin-top:10px}#hlist.snap form input{display:block!important;flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:15px;background:var(--soft);color:var(--ink)}
.hk{display:none}
@media (max-width:420px){.hit .tag{display:none}}
/* 비서 탭 대화방 칩 */
.rchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px}.rchips::-webkit-scrollbar{display:none}.rchips:empty{display:none}
.rchips button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:40px;padding:6px 12px;font:inherit;font-size:13px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rchips button.on{background:var(--gold);border-color:var(--gold);color:#fff}.rchips .rdot{flex:0 0 8px}.rst{font-size:11.5px;color:var(--mute);font-weight:500}
.tooluse{font-size:11.5px;color:var(--mute);padding:0 6px}.msg.pend{opacity:.6}
/* 더보기 업무별 소제목 */
.msec{margin:18px 4px 8px;font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.02em}.msec:first-child{margin-top:4px}
/* 길게 눌러 끌기 */
body.sorting{user-select:none;-webkit-user-select:none}.lifting{position:relative;z-index:5;background:var(--card)!important;box-shadow:0 10px 28px rgba(40,37,59,.18),0 0 0 2px var(--gold);border-radius:10px;transform:scale(1.02)}
.todo li,.hit[data-todo]{touch-action:pan-y;-webkit-touch-callout:none}
/* 카드 종류별 위쪽 색 띠 (맥과 같음) */
.card[data-id]{border-top:1px solid var(--line)}  /* Mercury: 색 띠 대신 색 한 단계 */
.card[data-id=brief]{--cc:#4f46e5}.card[data-id=todo]{--cc:#f59e0b}.card[data-id=proj]{--cc:#8b5cf6}.card[data-id=chat]{--cc:#6366f1}.card[data-id=mail]{--cc:#0ea5e9}.card[data-id=collab]{--cc:#ec4899}.card[data-id=oc]{--cc:#06b6d4}.card[data-id=memo]{--cc:#eab308}.card[data-id=stats]{--cc:#f43f5e}.card[data-id=act]{--cc:#6366f1}.card[data-id=contacts]{--cc:#64748b}
.chip{background:var(--goldbg);color:var(--gold)}
/* 맥에서 온 화면 조각: 버튼·입력은 숨기고(폰 버튼으로 대신), 글은 읽기 좋게 */
.snap{overflow-x:auto}.snap button:not(.fchip),.snap .x,.snap form,.snap .sm,.snap .cardctl,.snap .acts,.snap input,.snap .hov,.snap .rowact{display:none!important}.snap .smodal{display:none}
.snap button.fchip{pointer-events:none}
.snap .acts2 button.sm{display:inline-block!important} .snap a[href^="/open"]{pointer-events:none;text-decoration:none} .snap p.muted>a[href^="/open"]:only-child{display:none}
.card[data-id=chat] h2::after{display:none}
.snap a{color:var(--ink);text-decoration:none} .snap a.flink{color:var(--gold);pointer-events:none}
.snap .list li,.list li{padding:9px 0;border-bottom:1px solid var(--line2);margin:0}.list{list-style:none;padding:0}.list li:last-child{border-bottom:0}
.snap .files li{display:flex;gap:10px;justify-content:space-between;align-items:baseline}.snap .files li a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snap .clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--ink2)} .snap .clip.muted{color:var(--mute);font-size:12px}
.snap .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.snap .row b{flex:1;min-width:0}
.snap details>summary{color:var(--mute);font-size:13px;padding:6px 0}
.snap code{background:var(--line2);border-radius:5px;padding:0 4px;font-size:12px}
.snap .tag{font-size:11px;color:var(--gold);background:var(--goldbg);border-radius:5px;padding:0 6px;white-space:nowrap}
.snap .live{color:var(--green);font-size:12px}
/* 브리핑: 날짜 칸을 옆으로 넘겨 보기 */
.bhead{font-weight:650;font-size:16px;line-height:1.5;margin-bottom:4px;letter-spacing:-.02em}
.bcols{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px -16px 4px;padding:0 16px 4px;scrollbar-width:none}.bcols::-webkit-scrollbar{display:none}
.bcol{flex:0 0 84%;scroll-snap-align:start;background:var(--soft);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
.bcol::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--line)}.bcol.today::before{background:var(--gold)}.bcol.missed::before{background:var(--red)}.bcol.week::before{background:var(--navy)}
.bct{font-weight:650;font-size:14px;margin-bottom:6px;display:flex;gap:6px;align-items:baseline}.bct .muted{font-weight:400}.bcol.missed .bct{color:var(--red)}
.bcol ul{padding-left:16px;font-size:14px}.bcol li{margin:5px 0;line-height:1.45}.bcol li.ev{list-style:none;margin-left:-16px}
.bdots{display:flex;gap:5px;justify-content:center;margin-top:4px}.bdots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .2s}.bdots i.on{background:var(--gold);width:16px;border-radius:3px}
.fchip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;margin:2px 0;background:var(--card);color:var(--ink);font:inherit;font-size:12px}.fchip.red{color:var(--red);border-color:var(--red);background:var(--redbg)}.fchip.gold{color:var(--gold);border-color:var(--gold)}
.bplan{color:var(--gold);font-size:13px;margin-top:8px;font-weight:500}.time{color:var(--gold);font-weight:600;font-size:13px;margin-right:4px}
/* 할 일 */
.todo{list-style:none;padding:0;margin:0}.todo li{display:flex;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line2);margin:0}.todo li:last-child{border-bottom:0}
.todo li label{flex:1;display:flex;gap:12px;align-items:center;min-width:0}.todo .done label span{color:var(--mute);text-decoration:line-through}
.todo input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:0 0 22px;width:22px;height:22px;border:2px solid var(--line);border-radius:7px;margin:0;display:grid;place-content:center;transition:all .15s}
.todo input[type=checkbox]:checked{background:var(--gold);border-color:var(--gold)}.todo input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.x{border:0;background:none;color:var(--mute);font-size:18px;padding:4px 6px;opacity:.6}
.pill{font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;color:var(--gold);background:var(--goldbg);white-space:nowrap}.pill.red{color:var(--red);background:var(--redbg)}.pill.gray{color:var(--mute);background:var(--line2)}.pill.green{color:var(--green);background:var(--greenbg)}
.tag{font-size:11px;color:var(--gold);background:var(--goldbg);border-radius:5px;padding:1px 6px;white-space:nowrap}
/* 현황표 */
.proj{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--soft);margin:0 0 10px}.proj.stalled{border-color:var(--red)}
.proj .row b{font-size:15px}
.bar{height:5px;background:var(--line2);border-radius:3px;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px}
.steps{list-style:none;padding:0;margin:6px 0}.steps li{display:flex;gap:10px;padding:8px 0;font-size:14px;align-items:center;border-bottom:1px dashed var(--line2);margin:0}.steps li.cur{color:var(--gold);font-weight:600}.steps li.ok{color:var(--mute)}
.chk{flex:0 0 22px;height:22px;line-height:22px;text-align:center;border-radius:11px;background:var(--line2);font-size:11px;color:var(--mute)}.cur .chk{background:var(--gold);color:#fff}.ok .chk{background:var(--green);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row b{flex:1;min-width:0}
/* 수업 */
.oc{width:100%;border-collapse:collapse;font-size:13px}.oc td,.oc th{padding:7px 5px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}.oc th{color:var(--mute);font-weight:500;font-size:12px}
.snap table:has(th:nth-child(5)){min-width:560px}.oc tr.today td{background:var(--goldbg)}
.slot{display:inline-block;margin:1px 8px 2px 0;white-space:nowrap}.slot.cancel{text-decoration:line-through;color:var(--mute)}.slot.makeup{color:var(--gold)}
.att{font-size:11px;font-weight:600;border-radius:5px;padding:0 5px;margin-left:3px;color:var(--green);background:var(--greenbg)}.att.none{background:var(--line2);color:var(--mute)}.att.absent{color:var(--red);background:var(--redbg)}.att.makeup{color:var(--gold);background:var(--goldbg)}
.oc .dn{font-weight:600}
/* 성과 */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{background:var(--soft);border:1px solid var(--line2);border-radius:12px;padding:10px 6px;text-align:center}.tile b{display:block;font-size:22px;font-weight:700;color:var(--ink);line-height:1.15}.tile span{font-size:11.5px;color:var(--mute)}
/* 비서 */
.chat{display:flex;flex-direction:column;gap:8px}.msg{max-width:86%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:5px}.msg.user .muted{color:#c9d2e6}.msg.user a{color:#fff}
.msg.assistant{align-self:flex-start;background:var(--soft);border:1px solid var(--line2);border-bottom-left-radius:5px}.msg.err{border:1px solid var(--red)}.msg .muted{display:block;font-size:11px;margin-top:4px}
.live{color:var(--green);font-size:13px}
#t-chat .card{display:flex;flex-direction:column;height:calc(100dvh - var(--hh) - 80px - env(safe-area-inset-bottom));margin:0}
#t-chat .chat{flex:1;overflow-y:auto;margin:0 -6px;padding:2px 6px 8px;overscroll-behavior:contain}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px 0 0}.quick::-webkit-scrollbar{display:none}
.quick button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px}
/* 입력·버튼 */
form.inline{display:flex;gap:8px;margin-top:10px}
form.inline input,textarea{flex:1;min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:15px;background:var(--soft);color:var(--ink);width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--gold);background:var(--card);box-shadow:0 0 0 3px var(--goldbg)}
button.sm{background:var(--ink);color:var(--card);border:0;border-radius:10px;padding:8px 14px;font:inherit;font-size:13.5px;font-weight:500;white-space:nowrap}
form.inline button.sm{padding:0 16px;border-radius:12px}
button.ghost{background:none;color:var(--ink2);border:1px solid var(--line)}
button:active{transform:scale(.96)}
.acts2{margin-top:12px}
/* 아래 탭 바 */
/* 아래 탭 바: 화면 맨 아래(홈 버튼 바로 위)에 붙고, 내용은 그 위에서 끝난다 → 겹치지 않음 */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;padding:6px 0 5px;font:inherit;font-size:11.5px;color:var(--mute);border-radius:15px;position:relative;transition:background .2s,color .2s}
nav button span{display:block;font-size:19px;line-height:1.2;filter:grayscale(1);opacity:.75}
nav button.on{color:var(--ink);font-weight:600;background:var(--goldbg)} nav button.on span{filter:none;opacity:1}
nav button i{position:absolute;top:2px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-style:normal;font-weight:700;line-height:17px}
nav button i:empty{display:none}
/* 로그인 */
.gate{display:flex;align-items:center;justify-content:center;min-height:80vh}.gate form{background:var(--card);padding:26px 22px;border-radius:18px;width:min(360px,92vw);box-shadow:var(--sh);border:1px solid var(--line)}
.gate input{width:100%;font:inherit;font-size:16px;padding:13px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:var(--soft);color:var(--ink)}
.gate button{width:100%;margin-top:10px;background:var(--ink);color:var(--card);border:0;border-radius:12px;padding:13px;font:inherit;font-size:16px;font-weight:600}
.tsh{position:fixed;inset:0;background:rgba(20,20,30,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center}.tsh>div{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--sh2)}
.tsh b{display:block;font-size:13px;color:var(--mute);margin:0 0 8px}.tsh input{width:100%;box-sizing:border-box;padding:12px 13px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:var(--soft);color:var(--ink);margin:0 0 10px}
.tsh .tr{display:flex;gap:8px}.tsh .tr button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:15px;color:var(--ink)}.tsh .tr .pri{background:var(--gold);border-color:var(--gold);color:#fff}.tsh .tr .del{color:var(--red);flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:9px 15px;border-radius:12px;font-size:13.5px;display:none;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:nowrap}
.tab{display:none}.tab.on{display:block}.chip{display:none}details summary{cursor:pointer}
#memo{min-height:150px;line-height:1.7}
/* 펼친 화면(폴드·태블릿): 아래 탭 바는 그대로, 고른 탭의 카드를 격자로 */
@media (min-width:700px){
  main{padding:6px 18px}.tab.on{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  .card{margin:0}.card.wide,#t-proj .card,#t-chat .card{grid-column:1/-1}
  .bcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));overflow:visible;margin:10px 0 4px;padding:0}.bcol{flex:none}.bdots{display:none}
  .tiles{grid-template-columns:repeat(4,1fr)}
  nav{padding-left:calc(50% - 280px);padding-right:calc(50% - 280px)}
  #t-chat .card{max-width:860px;justify-self:center;width:100%}
  .snap table:has(th:nth-child(5)){min-width:0}
}
@media (min-width:1100px){.tab.on{grid-template-columns:repeat(3,minmax(0,1fr))}}
.care{background:var(--goldbg);border:0}.card h2{font-weight:550}.bhead{font-weight:500}.tile b{font-weight:500}
button.sm,form.inline button.sm{background:var(--gold);color:#fff;border-radius:40px}button.ghost{background:none;color:var(--ink2)}.quick button{border-radius:40px}
</style>

<script>
const $=id=>document.getElementById(id);const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get:k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const db=supabase.createClient(JH_CFG.url,JH_CFG.key);let UID=null,S={};const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2500)}
function tab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.id==='t-'+t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));localStorage.setItem('tab',t);window.scrollTo(0,0);hh();if(t==='chat')chatBottom()}
// '오늘 할 것' 한 목록: 맥이 만든 목록에 폰 동작을 다시 단다
function renderHList(s){const fresh=s.at&&(Date.now()-new Date(s.at))/6e4<15&&s.hlist;$('hlist').innerHTML=fresh?s.hlist:'';document.querySelector('.card[data-id=todo]').style.display=fresh?'none':'';if(!fresh)return;
 const L=$('hlist');L.querySelectorAll('.hcb input').forEach(c=>{const i=+(c.getAttribute('onchange')||'').match(/\d+/)?.[0];c.onchange=()=>{toggleTodo(i);c.closest('.hit').classList.toggle('hdone',c.checked)}});
 L.querySelectorAll('.hck').forEach(b=>{const id=(b.getAttribute('onclick')||'').match(/[0-9a-f]{10}/)?.[0];b.onclick=()=>{inbox('care_ok',id);b.closest('.hit').remove()}});
 L.querySelectorAll('.hask').forEach(b=>{b.onclick=()=>{ask(b.dataset.t);tab('chat')}});
 L.querySelectorAll('.hit[data-todo] .ht').forEach(t=>{t.removeAttribute('ondblclick');t.onclick=()=>todoSheet(+t.closest('.hit').dataset.todo)});
 L.querySelectorAll('.ht[onclick]').forEach(t=>{const id=(t.getAttribute('onclick')||'').match(/'(\w+)'/)?.[1];t.onclick=()=>goCard(id)});
 const f=L.querySelector('form');if(f)f.onsubmit=e=>{e.preventDefault();$('ti').value=$('ht').value;$('ht').value='';addTodo(e);toast('할 일에 넣었어요')}}
function goCard(id){const m={mailc:'mail',occ:'oc',collab:'collab',proj:'proj',todo:'todo'};const cid=m[id]||id;tab(cid==='proj'?'proj':cid==='todo'?'today':'more');const c=document.querySelector(`.card[data-id="${cid}"]`);if(c){c.classList.remove('fold');setTimeout(()=>c.scrollIntoView({behavior:'smooth',block:'start'}),60)}}
// 비서 탭의 대화방: 비서 + 맥에서 고른 코드 세션(맥이 1분마다·바뀔 때 올림)
let PROOM=localStorage.getItem('proom')||'';
function renderRooms(){const s=S.snapshot?.data||{};const rs=s.rooms||[];if(PROOM&&!rs.some(r=>r.cli===PROOM))PROOM='';
 const st={busy:'작업 중',open:'앱에 열림',idle:'쉬는 중'};
 $('rchips').innerHTML=rs.length?`<button class="${PROOM?'':'on'}" onclick="pickRoom('')">✦ 비서</button>`+rs.map(r=>`<button class="${PROOM===r.cli?'on':''}" onclick="pickRoom('${r.cli}')"><i class="rdot ${r.state}"></i>${E(r.title)}</button>`).join(''):'';
 const r=rs.find(x=>x.cli===PROOM);$('rtitle').textContent=r?r.title:'비서';$('rstate').textContent=r?st[r.state]:'';
 const atB=$('chat').scrollHeight-$('chat').scrollTop-$('chat').clientHeight<80;
 $('chat').innerHTML=r?r.html:(s.chat||'');$('ci').placeholder=r?'이 세션에 말하기':'비서에게 말하기';document.querySelector('#t-chat .quick').style.display=r?'none':'';if(atB)chatBottom()}
function pickRoom(id){PROOM=id;localStorage.setItem('proom',id);renderRooms();chatBottom()}
function chanBtns(){document.querySelectorAll('#hflow .hch').forEach(b=>{const k=(b.getAttribute('onclick')||'').match(/'(insta|threads|youtube|blog)'/)?.[1];if(!k)return;b.removeAttribute('onclick');b.onclick=()=>{b.classList.toggle('on');b.querySelector('b').textContent=b.classList.contains('on')?'✓':'○';inbox('chan',k)}})}
function careBtns(){document.querySelectorAll('#care .cv').forEach(li=>{const id=(li.querySelector('.ca button')?.getAttribute('onclick')||'').match(/[0-9a-f]{10}/)?.[0];if(!id||li.querySelector('.pok'))return;const b=document.createElement('button');b.className='pok';b.textContent='알았어요';b.onclick=()=>{inbox('care_ok',id);li.remove()};li.append(b)})}
function hh(){document.documentElement.style.setProperty('--hh',$('hdr').offsetHeight+($('stale').hidden?0:$('stale').offsetHeight+8)+'px')}
function chatBottom(){const c=$('chat');requestAnimationFrame(()=>c.scrollTop=c.scrollHeight)}
function ask(t){inbox('chat',t);$('chat').insertAdjacentHTML('beforeend',`<div class="msg user">${E(t)}<span class="muted">보냄 · 맥이 받으면 답해요</span></div>`);chatBottom()}
// 카드 제목을 누르면 접기/펴기 (이 기기에 기억). 처음엔 세션 기록·연락처만 접어 둔다
const FOLD=JSON.parse(localStorage.getItem('pfold')||'["act","contacts","brief"]');
document.addEventListener('click',e=>{const h=e.target.closest('.card[data-id] > h2');if(!h||e.target.closest('button'))return;const c=h.parentElement,id=c.dataset.id;if(id==='chat')return;c.classList.toggle('fold');const i=FOLD.indexOf(id);c.classList.contains('fold')?(i<0&&FOLD.push(id)):(i>=0&&FOLD.splice(i,1));localStorage.setItem('pfold',JSON.stringify(FOLD))});
document.querySelectorAll('.card[data-id]').forEach(c=>c.classList.toggle('fold',FOLD.includes(c.dataset.id)));

function briefDots(){const b=document.querySelector('#brief .bcols');if(!b)return;let d=b.nextElementSibling;if(!d||!d.classList.contains('bdots')){d=document.createElement('div');d.className='bdots';b.after(d)}

sortable($('hlist'),'.hit[data-todo]',{group:el=>el.dataset.g,ok:(to,el)=>to.dataset.g===el.dataset.g||HDROP.includes(to.dataset.g),head:'.hgrp[data-g]',onDrop:el=>{let h=el.previousElementSibling;while(h&&!h.classList.contains('hgrp'))h=h.previousElementSibling;const g=h?.dataset.g,mv=g&&g!==el.dataset.g?[+el.dataset.todo,g]:null;
 todoOrder([...document.querySelectorAll('#hlist .hit[data-todo]')].map(x=>+x.dataset.todo),mv);if(mv){el.dataset.g=g;toast(`'${g}'(으)로 옮겼어요`)}}});  // 그릴 때마다 폰에 저장
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
